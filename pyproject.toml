[project]
name = "api-rest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zebi lobognon", email = "zebilobognon@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "bcrypt==4.0.1",
    "fastapi[standard]>=0.141.1",
    "jose>=1.0.0",
    "loguru>=0.7.3",
    "passlib>=1.7.4",
    "pyjwt>=2.14.0",
    "python-jose[cryptography]>=3.5.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
api-rest = "api_rest:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
